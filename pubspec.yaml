# To change the visualized name of app use, package rename command: rename setAppName --targets ios,android,macos,windows,linux --value "Beauty Center"
name: beauty_center
description: "Management app for beauty centers with offline-first approach."
publish_to: 'none'
version: 0.1.5

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.41.6"

dependencies:
  flutter:
    sdk: flutter

  # Localizations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Local DB
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  path: ^1.9.1

  # Remote backend
  supabase_flutter: ^2.12.4

  # UI and theming
  flex_color_scheme: ^8.4.0
  flutter_screenutil: ^5.9.3
  material_symbols_icons: ^4.2928.1
  font_awesome_flutter: ^11.0.0
  flex_color_picker: ^3.8.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  syncfusion_flutter_datepicker: ^33.2.5
  syncfusion_flutter_pdf: ^33.2.5
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  timely_x:
    path: ./packages/timely_x_flutter
  infinite_scroll_pagination: ^5.1.1
  flutter_typeahead: ^6.0.0

  # Navigation
  sidebarx: ^0.17.2
  google_nav_bar: ^5.0.7

  # Utils
  talker_flutter: ^5.1.16
  talker_riverpod_logger: ^5.1.16
  talker_dio_logger: ^5.1.16
  logging: ^1.3.0
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.1
  flutter_secure_storage: ^10.0.0
  package_info_plus: ^9.0.1
  dio: ^5.9.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  pinput: ^6.0.2
  flutter_fgbg: ^0.8.0
  flutter_contacts: ^2.0.2
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  equatable: ^2.0.8
  adaptive_theme: ^3.7.2
  leak_tracker: ^11.0.2
  very_good_analysis: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.3
  #custom_lint: ^0.8.1

  # Assets generators
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

  drift_dev: ^2.31.0
  build_runner: ^2.14.1
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/beauty_center_launcher_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icons/beauty_center_launcher_icon.png"
    icon_size: 256

flutter_native_splash:
  color: "#6750A4"
  color_dark: "#6750A4"
  image: "assets/icons/beauty_center_launcher_icon.png"
  android: true
  ios: false
  web: false
  android_gravity: center
  fullscreen: true
